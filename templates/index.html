<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDI Predictor | Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-3xl w-full bg-slate-900 rounded-3xl shadow-2xl p-6 md:p-10 border border-slate-800">
        <header class="mb-10">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                Previsão de UDI Online
            </h1>
            <p class="text-slate-400 mt-2">Simule o Useful Daylight Illuminance com precisão através de modelos de Machine Learning.</p>
        </header>

        <form method="POST" class="space-y-6">
            <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <label class="block text-sm font-semibold text-blue-300 mb-2 uppercase tracking-wider">Selecione o Modelo de Cálculo</label>
                <select name="tipo_modelo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer">
                    <option value="udi">UDI (Geral)</option>
                    <option value="more">UDI More (Excesso de iluminação)</option>
                    <option value="less">UDI Less (Iluminação insuficiente)</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">WWR (Window-to-Wall Ratio)</label>
                    <input type="number" step="0.01" name="wwr" placeholder="Ex: 0.40" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Tvis (Transmitância Visível)</label>
                    <input type="number" step="0.01" name="tvis" placeholder="Ex: 0.70" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Nº de Aletas</label>
                    <input type="number" step="1" name="n_aletas" placeholder="Ex: 5" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Ângulo das Aletas</label>
                    <input type="number" step="0.1" name="angulo" placeholder="Ex: 45" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Largura (Janela)</label>
                    <input type="number" step="0.01" name="largura" placeholder="Ex: 2.5" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Direção/Orientação (°)</label>
                    <input type="number" step="0.1" name="direcao" placeholder="Ex: 180" required 
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-[0.98] transition-all mt-4">
                Calcular Predição
            </button>
        </form>

        {% if prediction is not none %}
        <div class="mt-10 p-1 bg-gradient-to-r from-blue-500 to-emerald-500 rounded-2xl">
            <div class="bg-slate-900 rounded-[calc(1rem-1px)] p-6 text-center">
                <h2 class="text-sm uppercase font-bold tracking-[0.2em] text-slate-400 mb-1">Resultado {{ target }}</h2>
                <div class="flex items-center justify-center gap-2">
                    <span class="text-5xl font-black text-white">{{ prediction }}</span>
                    <span class="text-2xl font-bold text-blue-400">%</span>
                </div>
            </div>
        </div>
        {% endif %}

        <footer class="mt-12 text-center text-slate-500 text-xs">
            Desenvolvido para análise de desempenho lumínico.
        </footer>
    </div>

</body>
</html>
